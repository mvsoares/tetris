# nfpm configuration for Tetris
# yaml-language-server: $schema=https://nfpm.goreleaser.com/static/schema.json

name: "tetris"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
section: "games"
priority: "optional"
maintainer: "Marcus Soares <mvsoares>"
description: "Terminal Tetris in Go with high-performance AI, bitboard engine, and multilingual support"
vendor: "Marcus Soares"
homepage: "https://github.com/mvsoares/tetris"
license: "MIT"
contents:
  - src: "${BINARY_SRC}"
    dst: "/usr/bin/tetris"
    file_info:
      mode: 0755
  - src: "models/move-risk.json"
    dst: "/usr/share/tetris/models/move-risk.json"
    file_info:
      mode: 0644
  - src: "README.md"
    dst: "/usr/share/doc/tetris/README.md"
    file_info:
      mode: 0644
  - src: "LICENSE"
    dst: "/usr/share/doc/tetris/copyright"
    file_info:
      mode: 0644
